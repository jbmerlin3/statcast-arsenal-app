# Runs the data chain (scripts/update_data.R) and deploys the app.
# During the season an external cron starts it each morning; see docs/pipeline.md.

name: Refresh data and deploy

on:
  workflow_dispatch:
    inputs:
      repull_days:
        description: >-
          How many days back to re-pull. 21 is the in-season value. Raise it for a
          one-off sweep over games already past that window: 200 covers a whole
          season. Costs one Savant chunk request per 4 days.
        required: false
        default: '21'

# One run at a time, since each run pushes the season store back
concurrency:
  group: chain
  cancel-in-progress: false

jobs:
  chain:
    runs-on: ubuntu-latest
    # Up to 7 attempts 20 minutes apart while waiting for Savant
    timeout-minutes: 240

    # Write access to upload the refreshed store to the release
    permissions:
      contents: write

    env:
      # The season store lives in a release asset, not in git
      STATCAST_STORE: ${{ github.workspace }}/season-store/statcast_clean_2026.rds
      STORE_RELEASE: season-store
      # 21 days so late arm angle backfills are picked up
      REPULL_DAYS: ${{ github.event.inputs.repull_days || '21' }}

    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the graphics stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev \
            libtiff5-dev libjpeg-dev libharfbuzz-dev libfribidi-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # rsconnect is excluded from renv.lock, so install it here
      - name: Install rsconnect
        run: Rscript -e 'renv::install("rsconnect")'

      # Download the store and the last deploy stamp (the stamp lets a no-change run skip the deploy)
      - name: Fetch the season store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p season-store logs
          gh release download "$STORE_RELEASE" --pattern 'deployed_through.txt' \
            --dir logs --clobber || echo "no stamp yet, this run will deploy"
          if gh release download "$STORE_RELEASE" \
               --pattern 'statcast_clean_2026.rds' --dir season-store --clobber; then
            ls -lh season-store
          else
            echo "::error::No store asset found in release '$STORE_RELEASE'."
            echo "Seed it once from the laptop with:"
            echo "  gh release create $STORE_RELEASE ~/baseball-store/statcast_clean_2026.rds --notes 'season store'"
            exit 1
          fi

      - name: Authenticate rsconnect
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: Rscript scripts/ci_auth.R

      # Retry only when Savant hasn't posted last night's games yet; fail on anything else
      - name: Run the chain
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5 6 7; do
            if Rscript scripts/update_data.R 2>&1 | tee logs/chain-attempt-$attempt.log; then
              exit 0
            fi
            if ! grep -q "did not advance past" logs/chain-attempt-$attempt.log; then
              echo "::error::Chain failed for a reason other than Savant lag. Not retrying."
              exit 1
            fi
            if [ "$attempt" -eq 7 ]; then
              echo "::error::Savant still has not posted after 2 hours of retries."
              exit 1
            fi
            echo "::warning::Savant has not posted the latest games yet (attempt $attempt of 7). Retrying in 20 minutes."
            sleep 1200
          done

      - name: Push the refreshed store back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$STORE_RELEASE" \
            season-store/statcast_clean_2026.rds --clobber
          echo "store returned, $(du -h season-store/statcast_clean_2026.rds | cut -f1)"
          # Upload the deploy stamp (unchanged when this run skipped the deploy)
          if [ -f logs/deployed_through.txt ]; then
            gh release upload "$STORE_RELEASE" logs/deployed_through.txt --clobber
            echo "stamp returned: $(tr '\n' ' ' < logs/deployed_through.txt)"
          fi

      # Keep logs even when the run fails
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-output
          path: |
            logs/
            data/*.rds
          retention-days: 7
          if-no-files-found: ignore
